$kind: http-request
method: DELETE
url: '{{baseUrl}}/api/books/{{bookId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("Response body contains 'Book deleted'", function () {
          pm.expect(pm.response.text()).to.include("Book deleted");
      });
