$kind: http-request
method: POST
url: '{{baseUrl}}/api/users'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "jane@example.com",
      "password": "securepass"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.expect(pm.response.code).to.eql(200);
      });
      pm.test("Response has 'id' field (not null)", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.id).to.not.be.null;
          pm.expect(jsonData.id).to.not.be.undefined;
      });
      pm.test("Response has 'name' equal to 'Jane Doe'", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.name).to.eql("Jane Doe");
      });
      pm.collectionVariables.set("userId", pm.response.json().id);
